<!DOCTYPE html>

    </nav>
    <span class="spacer"></span>
    <span class="env" id="env" title="">检测编译器…</span>
    <button class="icon-btn" id="theme-btn" title="切换深色 / 浅色">🌓</button>
  </header>
  <div id="env-banner"></div>
  <main id="app"></main>
